name: CI/CD

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
      - run: npm run build
      # No test suite yet — add a test job here once a framework (e.g. vitest) is chosen for backend/.


  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker-validate:
    if: github.event_name == 'pull_request'
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [backend-ci, frontend-ci]
    runs-on: self-hosted
    environment: production
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy .env into workspace
        run: |
          $candidatePaths = @("D:\BVC\bach-viet-cam\.env", "D:\BVC\.env")
          $found = $false
          foreach ($src in $candidatePaths) {
            if (Test-Path $src) {
              Write-Host "Found .env at $src. Copying into workspace..."
              Copy-Item -Path $src -Destination ".env" -Force
              $found = $true
              break
            }
          }
          if (-not $found) {
            Write-Error "CRITICAL: Could not find .env at D:\BVC\bach-viet-cam\.env or D:\BVC\.env!"
            exit 1
          }

      - name: Rebuild and restart services with Docker Compose
        run: |
          Write-Host "Rebuilding and restarting containers..."
          docker compose up -d --build
          Write-Host "Pruning unused Docker images..."
          docker image prune -f

      - name: Smoke test backend health endpoint
        run: |
          Start-Sleep -Seconds 5
          curl.exe -fsS http://localhost:8000/api/health
